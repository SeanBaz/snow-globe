<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Snow Globe</title>
<meta name="description" content="Shake it to find out who you're Secret Santa for this year.">
<meta property="og:title" content="A snow globe for you ❄️">
<meta property="og:description" content="Shake it to find out who you're Secret Santa for this year.">
<meta property="og:image" content="https://seanbaz.github.io/snow-globe/preview.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #0b1530;
    --sky-bottom: #2a1b4a;
    --ink: #f4f1ea;
    --muted: #b9c2dc;
    --gold: #f6c453;
    --red: #d63c3c;
    --red-dark: #9e2424;
    --card: rgba(255, 255, 255, 0.08);
    --card-border: rgba(255, 255, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%) fixed;
    color: var(--ink);
    font-family: "Nunito", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px 40px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  h1 {
    font-family: "Mountains of Christmas", cursive;
    font-size: clamp(2.1rem, 9vw, 2.9rem);
    line-height: 1.05; margin: 8px 0 6px;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 24px rgba(246,196,83,.35);
  }
  .sub { margin: 0 0 8px; color: var(--muted); font-size: 1rem; line-height: 1.4; max-width: 34ch; }
  #stage { position: relative; width: min(92vw, 420px); touch-action: none; user-select: none; -webkit-user-select: none; }
  #globe { display: block; width: 100%; height: auto; transform-origin: 50% 85%; cursor: pointer; }
  #status {
    min-height: 1.6em; margin: 6px 0 14px;
    font-weight: 800; font-size: 1.15rem; letter-spacing: .01em;
  }
  #status.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); opacity: .85; } }
  button {
    font: inherit; font-weight: 800; font-size: 1.1rem;
    color: #fff; background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    border: 2px solid rgba(255,255,255,.25); border-radius: 999px;
    padding: 14px 28px; cursor: pointer;
    box-shadow: 0 6px 0 #6d1616, 0 10px 24px rgba(0,0,0,.35);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #6d1616, 0 6px 14px rgba(0,0,0,.35); }
  button.ghost {
    background: transparent; box-shadow: none; border-color: var(--card-border);
    font-size: .95rem; padding: 10px 20px; color: var(--muted);
  }
  #reveal {
    display: none; width: 100%; margin-top: 4px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
    padding: 18px 16px 20px;
    opacity: 0; transform: translateY(12px) scale(.98);
    transition: opacity .7s ease, transform .7s cubic-bezier(.2,.9,.3,1.3);
  }
  #reveal.show { opacity: 1; transform: none; }
  #reveal .lead { margin: 0; color: var(--muted); font-size: 1.05rem; }
  #reveal .name {
    font-family: "Mountains of Christmas", cursive;
    font-size: clamp(3rem, 15vw, 4.4rem); line-height: 1.05; margin: 4px 0 6px;
    color: var(--gold); text-shadow: 0 0 28px rgba(246,196,83,.5);
  }
  #reveal .shh { margin: 0 0 14px; font-size: 1rem; }
  #mute {
    position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 2;
    width: 44px; height: 44px; padding: 0; font-size: 1.2rem;
    border-radius: 50%; background: rgba(255,255,255,.1); box-shadow: none; border: 1px solid var(--card-border);
  }
  footer { margin-top: 22px; color: var(--muted); font-size: .85rem; opacity: .8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<button id="mute" aria-label="Sound on" title="Sound">🔊</button>
<main>
  <h1 id="hello">Ho ho ho!</h1>
  <p class="sub" id="intro">The elves have sealed your Secret Santa name inside this snow globe. It's frozen solid, so you'll have to shake it loose.</p>
  <div id="stage"><canvas id="globe" aria-label="A snow globe"></canvas></div>
  <div id="status" aria-live="polite"></div>
  <button id="start">🎄 Tap to begin</button>
  <section id="reveal" aria-live="polite">
    <p class="lead">This year you're the Secret Santa for…</p>
    <div class="name" id="revealName"></div>
    <p class="shh">🤫 Shhh… it's top secret. Happy gifting! 🎁</p>
    <button class="ghost" id="again">Shake it again ❄️</button>
  </section>
  <footer>Delivered by the North Pole Secret Santa Office · 2026</footer>
</main>
<script>
(() => {
  // ---------- assignment, decoded from the link's #hash (never sent to the server) ----------
  const KEY = "frosty-2026";
  function decode(hash) {
    try {
      const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
      const bytes = Uint8Array.from(bin, (c, i) => c.charCodeAt(0) ^ KEY.charCodeAt(i % KEY.length));
      const data = JSON.parse(new TextDecoder().decode(bytes));
      return data && data.g && data.r ? data : null;
    } catch (e) { return null; }
  }
  const who = decode(location.hash.slice(1));

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), startBtn = $("start"), revealEl = $("reveal");

  if (who) {
    $("hello").textContent = `Ho ho ho, ${who.g}!`;
  } else {
    $("intro").textContent = "Hmm… this snow globe is empty. Ask Santa for your personal link!";
    startBtn.classList.add("hidden");
  }

  // ---------- sound (Web Audio, no files) ----------
  let ctx = null, muted = false;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  $("mute").addEventListener("click", () => {
    muted = !muted;
    $("mute").textContent = muted ? "🔇" : "🔊";
    $("mute").setAttribute("aria-label", muted ? "Sound off" : "Sound on");
  });
  let lastJingle = 0;
  function jingle(strength) {
    const a = audio(); if (!a || muted) return;
    const now = a.currentTime;
    if (now - lastJingle < 0.09) return;
    lastJingle = now;
    const len = 0.18, buf = a.createBuffer(1, Math.floor(a.sampleRate * len), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    const src = a.createBufferSource(); src.buffer = buf;
    const hp = a.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 6500 + Math.random() * 2500; hp.Q.value = 2.5;
    const g = a.createGain(); g.gain.value = Math.min(0.35, 0.08 + strength * 0.25);
    src.connect(hp).connect(g).connect(a.destination); src.start(now);
  }
  function bell(freq, t, dur = 1.2, vol = 0.22) {
    const a = ctx; if (!a || muted) return;
    [[1, 1], [2.76, 0.35], [5.4, 0.12]].forEach(([mult, amp]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.value = freq * mult;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol * amp, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mult);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
    });
  }
  function jingleBellsTune() {
    const a = audio(); if (!a || muted) return;
    const E = 659.25, G = 783.99, C = 523.25, D = 587.33, b = 0.22;
    const notes = [[E,1],[E,1],[E,2],[E,1],[E,1],[E,2],[E,1],[G,1],[C,1.5],[D,.5],[E,4]];
    let t = a.currentTime + 0.05;
    notes.forEach(([f, beats]) => { bell(f, t, 1.4); t += beats * b; });
  }

  // ---------- globe canvas ----------
  const canvas = $("globe"), g = canvas.getContext("2d");
  let W = 0, H = 0, R = 0, cx = 0, cy = 0, dpr = 1;
  function layout() {
    const cssW = canvas.parentElement.clientWidth;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = cssW; H = Math.round(cssW * 1.12);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.height = H + "px";
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = W * 0.43; cx = W / 2; cy = R + W * 0.04;
    buildFrost();
  }
  const groundY = (x) => cy + R * 0.42 - R * 0.1 * Math.cos(((x - cx) / R) * Math.PI * 0.9);

  // snow particles live inside the sphere
  const flakes = [];
  function seedFlakes() {
    flakes.length = 0;
    for (let i = 0; i < 260; i++) {
      const x = cx + (Math.random() * 2 - 1) * R * 0.85;
      flakes.push({ x, y: groundY(x) - Math.random() * 2, vx: 0, vy: 0, s: 0.8 + Math.random() * 1.9, settled: true });
    }
  }

  // frost overlay texture, drawn once per layout
  let frost = null;
  function buildFrost() {
    frost = document.createElement("canvas");
    frost.width = Math.round(W * dpr); frost.height = Math.round(H * dpr);
    const f = frost.getContext("2d"); f.scale(dpr, dpr);
    const grad = f.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
    grad.addColorStop(0, "rgba(240,248,255,0.96)"); grad.addColorStop(1, "rgba(190,215,240,0.97)");
    f.fillStyle = grad; f.beginPath(); f.arc(cx, cy, R, 0, Math.PI * 2); f.fill();
    f.strokeStyle = "rgba(255,255,255,0.7)"; f.lineCap = "round";
    for (let i = 0; i < 26; i++) {
      const ang = Math.random() * Math.PI * 2, dist = Math.random() * R * 0.9;
      const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist, size = 6 + Math.random() * 14;
      f.lineWidth = 1 + Math.random();
      for (let k = 0; k < 6; k++) {
        const a = (k * Math.PI) / 3 + ang;
        f.beginPath(); f.moveTo(x, y); f.lineTo(x + Math.cos(a) * size, y + Math.sin(a) * size); f.stroke();
        const mx = x + Math.cos(a) * size * 0.55, my = y + Math.sin(a) * size * 0.55;
        f.beginPath(); f.moveTo(mx, my); f.lineTo(mx + Math.cos(a + 0.6) * size * 0.3, my + Math.sin(a + 0.6) * size * 0.3); f.stroke();
        f.beginPath(); f.moveTo(mx, my); f.lineTo(mx + Math.cos(a - 0.6) * size * 0.3, my + Math.sin(a - 0.6) * size * 0.3); f.stroke();
      }
    }
    f.fillStyle = "rgba(120,150,190,0.55)";
    f.font = `800 ${Math.round(R * 0.13)}px Nunito, system-ui, sans-serif`;
    f.textAlign = "center"; f.textBaseline = "middle";
    f.fillText("❄  FROZEN  ❄", cx, cy - R * 0.08);
  }

  function tree(x, base, h) {
    g.fillStyle = "#5b3a24"; g.fillRect(x - h * 0.06, base - h * 0.12, h * 0.12, h * 0.14);
    const tiers = [[0.62, 0.0], [0.5, 0.28], [0.36, 0.52]];
    tiers.forEach(([w, off]) => {
      g.fillStyle = "#1f7a4d";
      g.beginPath();
      g.moveTo(x - h * w * 0.5, base - h * 0.1 - h * off);
      g.lineTo(x + h * w * 0.5, base - h * 0.1 - h * off);
      g.lineTo(x, base - h * 0.1 - h * off - h * 0.42);
      g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,0.85)";
      g.beginPath();
      g.moveTo(x - h * w * 0.12, base - h * 0.1 - h * off - h * 0.32);
      g.lineTo(x + h * w * 0.12, base - h * 0.1 - h * off - h * 0.32);
      g.lineTo(x, base - h * 0.1 - h * off - h * 0.42);
      g.closePath(); g.fill();
    });
    g.fillStyle = "#f6c453";
    star(x, base - h * 1.0, h * 0.07);
  }
  function star(x, y, r) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + (i * Math.PI) / 5;
      g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    g.closePath(); g.fill();
  }
  function present(x, base, s) {
    g.fillStyle = "#d63c3c"; g.fillRect(x - s / 2, base - s, s, s);
    g.fillStyle = "#f6c453"; g.fillRect(x - s * 0.09, base - s, s * 0.18, s); g.fillRect(x - s / 2, base - s * 0.6, s, s * 0.16);
    g.beginPath(); g.ellipse(x - s * 0.18, base - s * 1.08, s * 0.2, s * 0.11, -0.4, 0, Math.PI * 2);
    g.ellipse(x + s * 0.18, base - s * 1.08, s * 0.2, s * 0.11, 0.4, 0, Math.PI * 2); g.fill();
  }

  // ---------- state ----------
  let phase = who ? "intro" : "empty"; // intro → shaking → settling → revealed
  let energy = 0;
  const TARGET = 1300;
  let wobble = 0, wobbleV = 0;
  let nameT = 0, sparkles = [];
  let settleStart = 0;

  function addShake(ax, ay, mag) {
    if (phase === "intro" || phase === "empty") return;
    const strength = Math.min(1, mag / 25);
    flakes.forEach((p) => {
      if (p.settled && Math.random() < 0.25 + strength * 0.6) p.settled = false;
      if (!p.settled) {
        p.vx += (-ax * 0.9 + (Math.random() - 0.5) * mag * 0.8) * 0.6;
        p.vy += (ay * 0.9 + (Math.random() - 0.5) * mag * 0.8 - mag * 0.35) * 0.6;
      }
    });
    wobbleV += (ax >= 0 ? -1 : 1) * Math.min(6, mag * 0.25);
    jingle(strength);
    if (phase === "shaking") {
      energy += Math.min(mag, 30);
      updateStatus();
      if (energy >= TARGET) {
        phase = "settling"; settleStart = performance.now();
        setStatus("Now let it settle… ✨", false);
      }
    } else if (phase === "revealed") {
      nameT = Math.min(nameT, 0.35);
    }
  }

  let motionMode = false;
  function setStatus(text, pulse) { statusEl.textContent = text; statusEl.classList.toggle("pulse", !!pulse); }
  function updateStatus() {
    const p = energy / TARGET;
    const verb = motionMode ? "shaking" : "tapping";
    if (p < 0.15) setStatus(motionMode ? "Shake your phone! 📳" : "Tap or drag the globe to shake it! 👆", true);
    else if (p < 0.5) setStatus(`Keep ${verb}! The ice is cracking… 🧊`, true);
    else if (p < 0.85) setStatus("Harder! Almost there… 💪", true);
    else setStatus("Just a little more! 🎅", true);
  }

  // ---------- input: device motion ----------
  let lastA = null;
  function onMotion(e) {
    const a = e.acceleration && e.acceleration.x != null ? e.acceleration : null;
    let ax, ay, az;
    if (a) { ax = a.x; ay = a.y; az = a.z || 0; }
    else if (e.accelerationIncludingGravity) {
      const ag = e.accelerationIncludingGravity;
      if (lastA) { ax = ag.x - lastA.x; ay = ag.y - lastA.y; az = (ag.z || 0) - (lastA.z || 0); }
      lastA = { x: ag.x, y: ag.y, z: ag.z };
      if (ax == null) return;
    } else return;
    const mag = Math.sqrt(ax * ax + ay * ay + az * az);
    if (mag > 3.5) {
      if (!motionMode) { motionMode = true; updateStatus(); }
      addShake(ax, ay, mag);
    }
  }

  // ---------- input: taps and drags (works everywhere, also a backup on phones) ----------
  let drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    audio();
    drag = { x: e.clientX, y: e.clientY };
    addShake((Math.random() - 0.5) * 30, -18, 22);
    if (phase === "shaking") energy += 70;
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, d = Math.hypot(dx, dy);
    if (d > 8) { addShake(-dx * 0.6, dy * 0.6, Math.min(30, d * 0.5)); drag = { x: e.clientX, y: e.clientY }; }
  });
  window.addEventListener("pointerup", () => { drag = null; });

  async function begin() {
    audio();
    startBtn.classList.add("hidden");
    $("intro").textContent = "Your name is frozen inside. Shake it loose!";
    phase = "shaking";
    let granted = true;
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      try { granted = (await DeviceMotionEvent.requestPermission()) === "granted"; } catch (e) { granted = false; }
    }
    if (granted && "DeviceMotionEvent" in window) window.addEventListener("devicemotion", onMotion);
    const isTouch = matchMedia("(pointer: coarse)").matches;
    if (granted && isTouch) setStatus("Shake your phone! 📳", true);
    else updateStatus();
  }
  startBtn.addEventListener("click", begin);

  $("again").addEventListener("click", () => {
    addShake((Math.random() - 0.5) * 40, -25, 28);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // ---------- reveal ----------
  function reveal() {
    phase = "revealed"; nameT = 0;
    setStatus("", false);
    $("revealName").textContent = who.r;
    revealEl.style.display = "block";
    $("intro").textContent = "The snow has settled… and the elves have spoken!";
    requestAnimationFrame(() => requestAnimationFrame(() => revealEl.classList.add("show")));
    setTimeout(() => revealEl.scrollIntoView({ behavior: "smooth", block: "end" }), 1600);
    jingleBellsTune();
    if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 200]);
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4;
      sparkles.push({ x: cx, y: cy - R * 0.08, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: 2 + Math.random() * 3 });
    }
    burstConfetti();
  }

  // ---------- render loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // wobble spring
    wobbleV += -wobble * 60 * dt - wobbleV * 6 * dt; wobble += wobbleV * dt * 10;
    canvas.style.transform = `rotate(${Math.max(-12, Math.min(12, wobble))}deg)`;

    // physics
    let moving = 0;
    flakes.forEach((p) => {
      if (p.settled) return;
      moving++;
      p.vy += 40 * dt; // gentle gravity, snow drifts
      p.vx *= 1 - 2.2 * dt; p.vy *= 1 - 2.2 * dt;
      p.vx += Math.sin(now / 700 + p.s * 9) * 4 * dt;
      p.x += p.vx * dt * 10; p.y += p.vy * dt * 10;
      const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy), max = R * 0.94;
      if (d > max) { p.x = cx + (dx / d) * max; p.y = cy + (dy / d) * max; p.vx *= -0.4; p.vy *= -0.4; }
      const gy = groundY(p.x);
      if (p.y >= gy && p.vy > 0) {
        p.y = gy - Math.random() * 1.5;
        if (Math.abs(p.vx) + Math.abs(p.vy) < 14) { p.settled = true; p.vx = p.vy = 0; }
        else p.vy *= -0.2;
      }
    });

    if (phase === "settling") {
      const t = now - settleStart;
      if ((moving < flakes.length * 0.12 && t > 1400) || t > 3800) reveal();
    }
    if (phase === "revealed") nameT = Math.min(1, nameT + dt * 0.8);

    draw(now);
    requestAnimationFrame(frame);
  }

  function draw(now) {
    g.clearRect(0, 0, W, H);
    // shadow under the globe
    g.fillStyle = "rgba(0,0,0,0.35)";
    g.beginPath(); g.ellipse(cx, cy + R * 1.18, R * 0.95, R * 0.09, 0, 0, Math.PI * 2); g.fill();

    // interior
    g.save();
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip();
    const sky = g.createLinearGradient(0, cy - R, 0, cy + R);
    sky.addColorStop(0, "#14305e"); sky.addColorStop(0.7, "#2c5a8c"); sky.addColorStop(1, "#5d86b5");
    g.fillStyle = sky; g.fillRect(cx - R, cy - R, R * 2, R * 2);
    // moon
    g.fillStyle = "rgba(255,248,220,0.9)";
    g.beginPath(); g.arc(cx + R * 0.45, cy - R * 0.5, R * 0.09, 0, Math.PI * 2); g.fill();

    // hidden name (only after reveal)
    if (phase === "revealed" && who) {
      const e = 1 - Math.pow(1 - nameT, 3);
      g.save();
      g.globalAlpha = e;
      g.translate(cx, cy - R * 0.12);
      g.scale(0.7 + 0.3 * e, 0.7 + 0.3 * e);
      let size = R * 0.46;
      g.font = `700 ${size}px "Mountains of Christmas", cursive`;
      const w = g.measureText(who.r).width;
      if (w > R * 1.5) { size *= (R * 1.5) / w; g.font = `700 ${size}px "Mountains of Christmas", cursive`; }
      g.textAlign = "center"; g.textBaseline = "middle";
      const gold = g.createLinearGradient(0, -size / 2, 0, size / 2);
      gold.addColorStop(0, "#fff3c4"); gold.addColorStop(0.5, "#f6c453"); gold.addColorStop(1, "#d99a1e");
      g.shadowColor = "rgba(255,210,100,0.9)"; g.shadowBlur = 18 + Math.sin(now / 300) * 6;
      g.lineWidth = Math.max(2, size * 0.06); g.strokeStyle = "rgba(90,40,0,0.6)";
      g.strokeText(who.r, 0, 0);
      g.fillStyle = gold; g.fillText(who.r, 0, 0);
      g.restore();
    }

    // ground and scene
    g.fillStyle = "#eef5ff";
    g.beginPath(); g.moveTo(cx - R, cy + R);
    for (let x = cx - R; x <= cx + R; x += 4) g.lineTo(x, groundY(x));
    g.lineTo(cx + R, cy + R); g.closePath(); g.fill();
    tree(cx - R * 0.55, groundY(cx - R * 0.55) + 2, R * 0.55);
    tree(cx + R * 0.58, groundY(cx + R * 0.58) + 2, R * 0.42);
    tree(cx + R * 0.32, groundY(cx + R * 0.32) + 2, R * 0.3);
    present(cx - R * 0.12, groundY(cx - R * 0.12) + 3, R * 0.16);
    present(cx + R * 0.08, groundY(cx + R * 0.08) + 3, R * 0.11);

    // sparkles
    sparkles = sparkles.filter((s) => (s.life -= 0.012) > 0);
    sparkles.forEach((s) => {
      s.x += s.vx; s.y += s.vy; s.vx *= 0.97; s.vy *= 0.97;
      g.globalAlpha = s.life; g.fillStyle = "#fff6cf"; star(s.x, s.y, s.r * 1.6);
    });
    g.globalAlpha = 1;

    // snow
    g.fillStyle = "#ffffff";
    flakes.forEach((p) => { g.beginPath(); g.arc(p.x, p.y, p.s, 0, Math.PI * 2); g.fill(); });

    // frost fades as you shake
    if (phase !== "revealed" && phase !== "settling" && frost) {
      g.globalAlpha = Math.max(0, 1 - energy / TARGET) * 0.92 + 0.04;
      g.drawImage(frost, 0, 0, W, H);
      g.globalAlpha = 1;
    }
    g.restore();

    // glass
    g.lineWidth = 3; g.strokeStyle = "rgba(255,255,255,0.45)";
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    const hl = g.createRadialGradient(cx - R * 0.45, cy - R * 0.5, 0, cx - R * 0.45, cy - R * 0.5, R * 0.7);
    hl.addColorStop(0, "rgba(255,255,255,0.35)"); hl.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = hl; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.55)"; g.lineWidth = R * 0.04; g.lineCap = "round";
    g.beginPath(); g.arc(cx, cy, R * 0.86, Math.PI * 1.12, Math.PI * 1.38); g.stroke();

    // base
    const top = cy + R * 0.8, bh = R * 0.36;
    const wood = g.createLinearGradient(0, top, 0, top + bh);
    wood.addColorStop(0, "#b8322f"); wood.addColorStop(1, "#7a1c1c");
    g.fillStyle = wood;
    g.beginPath();
    g.moveTo(cx - R * 0.72, top); g.lineTo(cx + R * 0.72, top);
    g.lineTo(cx + R * 0.9, top + bh); g.lineTo(cx - R * 0.9, top + bh); g.closePath(); g.fill();
    g.fillStyle = "#f6c453";
    g.fillRect(cx - R * 0.74, top - R * 0.03, R * 1.48, R * 0.06);
    g.fillRect(cx - R * 0.92, top + bh - R * 0.04, R * 1.84, R * 0.06);
    // name plate
    g.fillStyle = "#f3e2b3";
    roundRect(cx - R * 0.42, top + bh * 0.28, R * 0.84, bh * 0.42, 6); g.fill();
    g.fillStyle = "#7a1c1c";
    g.font = `800 ${Math.round(bh * 0.22)}px Nunito, system-ui, sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("SECRET SANTA 2026", cx, top + bh * 0.5);
  }
  function roundRect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- background sky: stars, falling snow, confetti ----------
  const sky = $("sky"), s2 = sky.getContext("2d");
  let SW = 0, SH = 0; const bg = [], confetti = [], stars = [];
  function skyLayout() {
    const r = Math.min(window.devicePixelRatio || 1, 2);
    SW = innerWidth; SH = innerHeight;
    sky.width = SW * r; sky.height = SH * r; s2.setTransform(r, 0, 0, r, 0, 0);
    stars.length = 0;
    for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * SW, y: Math.random() * SH * 0.7, r: Math.random() * 1.2 + 0.3, t: Math.random() * 6 });
  }
  for (let i = 0; i < 70; i++) bg.push({ x: Math.random() * 1000, y: Math.random() * 1000, r: Math.random() * 2 + 0.6, v: Math.random() * 0.5 + 0.3 });
  function burstConfetti() {
    const colors = ["#f6c453", "#d63c3c", "#2fa36b", "#ffffff", "#7fb7ff"];
    for (let i = 0; i < 140; i++) {
      confetti.push({ x: SW / 2, y: SH * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 12 - 3,
        w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3,
        c: colors[i % colors.length], life: 1 });
    }
  }
  function skyFrame(now) {
    s2.clearRect(0, 0, SW, SH);
    stars.forEach((s) => { s2.globalAlpha = 0.4 + 0.4 * Math.sin(now / 900 + s.t); s2.fillStyle = "#fff"; s2.beginPath(); s2.arc(s.x, s.y, s.r, 0, 7); s2.fill(); });
    s2.globalAlpha = 0.7; s2.fillStyle = "#fff";
    bg.forEach((f) => {
      f.y += f.v; f.x += Math.sin(now / 1500 + f.r) * 0.3;
      if (f.y > SH) { f.y = -5; f.x = Math.random() * SW; }
      s2.beginPath(); s2.arc(f.x % SW, f.y, f.r, 0, 7); s2.fill();
    });
    s2.globalAlpha = 1;
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.vy += 0.25; c.vx *= 0.99; c.x += c.vx; c.y += c.vy; c.a += c.va; c.life -= 0.004;
      if (c.y > SH + 20 || c.life <= 0) { confetti.splice(i, 1); continue; }
      s2.save(); s2.translate(c.x, c.y); s2.rotate(c.a); s2.fillStyle = c.c; s2.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); s2.restore();
    }
    requestAnimationFrame(skyFrame);
  }

  // ---------- go ----------
  layout(); seedFlakes(); skyLayout();
  // phones fire resize when the address bar slides; only rebuild when the width really changes
  let lastWidth = innerWidth;
  window.addEventListener("resize", () => {
    skyLayout();
    if (innerWidth === lastWidth) return;
    lastWidth = innerWidth; layout(); seedFlakes();
  });
  if (document.fonts && document.fonts.load) document.fonts.load('700 40px "Mountains of Christmas"').catch(() => {});
  requestAnimationFrame(frame); requestAnimationFrame(skyFrame);
})();
</script>
</body>
